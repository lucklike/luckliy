<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!--
        `@LuckyComponent` 组件类图标（Light 主题）。
        与 pluginIcon 同一设计语言，但按 16px 显示尺寸重新绘制轮廓：
        拉大中心十字缝隙、加深叶尖凹口、收窄叶片，保证小尺寸下仍能
        读出「四片心形叶 + 中心十字」的四叶草结构。
    -->
    <defs>
        <linearGradient id="luckyLeafA" x1="0.5" y1="1" x2="0.5" y2="0">
            <stop offset="0" stop-color="#1C9C4B"/>
            <stop offset="1" stop-color="#63E28A"/>
        </linearGradient>
        <linearGradient id="luckyLeafB" x1="0.5" y1="1" x2="0.5" y2="0">
            <stop offset="0" stop-color="#14803C"/>
            <stop offset="1" stop-color="#3FC766"/>
        </linearGradient>
    </defs>

    <g transform="translate(8 8)">
        <!-- 上叶、下叶（亮渐变） -->
        <path d="M0 -1.2C-0.85 -1.9 -3.1 -2.8 -3.1 -4.9C-3.1 -6.4 -2.05 -7.4 -1.25 -7.4C-0.55 -7.4 0 -6.2 0 -6.2C0 -6.2 0.55 -7.4 1.25 -7.4C2.05 -7.4 3.1 -6.4 3.1 -4.9C3.1 -2.8 0.85 -1.9 0 -1.2Z"
              fill="url(#luckyLeafA)"/>
        <path d="M0 -1.2C-0.85 -1.9 -3.1 -2.8 -3.1 -4.9C-3.1 -6.4 -2.05 -7.4 -1.25 -7.4C-0.55 -7.4 0 -6.2 0 -6.2C0 -6.2 0.55 -7.4 1.25 -7.4C2.05 -7.4 3.1 -6.4 3.1 -4.9C3.1 -2.8 0.85 -1.9 0 -1.2Z"
              transform="rotate(180)"
              fill="url(#luckyLeafA)"/>
        <!-- 右叶、左叶（暗渐变，拉开层次） -->
        <path d="M0 -1.2C-0.85 -1.9 -3.1 -2.8 -3.1 -4.9C-3.1 -6.4 -2.05 -7.4 -1.25 -7.4C-0.55 -7.4 0 -6.2 0 -6.2C0 -6.2 0.55 -7.4 1.25 -7.4C2.05 -7.4 3.1 -6.4 3.1 -4.9C3.1 -2.8 0.85 -1.9 0 -1.2Z"
              transform="rotate(90)"
              fill="url(#luckyLeafB)"/>
        <path d="M0 -1.2C-0.85 -1.9 -3.1 -2.8 -3.1 -4.9C-3.1 -6.4 -2.05 -7.4 -1.25 -7.4C-0.55 -7.4 0 -6.2 0 -6.2C0 -6.2 0.55 -7.4 1.25 -7.4C2.05 -7.4 3.1 -6.4 3.1 -4.9C3.1 -2.8 0.85 -1.9 0 -1.2Z"
              transform="rotate(270)"
              fill="url(#luckyLeafB)"/>
    </g>
</svg>
