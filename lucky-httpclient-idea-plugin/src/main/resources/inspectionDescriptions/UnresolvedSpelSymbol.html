<body>
报告 lucky-httpclient 注解字符串中无法解析的 SpEL 变量与函数。

<p>
检查只在可确定的上下文中生效：字符串必须位于注解元数据表登记过的 SpEL 属性内，
且所在模块依赖 lucky-httpclient。未知上下文不会报告，避免把运行期动态注册的
变量误判为错误。
</p>

<p>
默认严重级别为警告，可在 <b>Settings | Editor | Inspections | Lucky HttpClient SpEL</b>
中调整级别或完全关闭。单条结果可用「抑制此提示」快速修复添加
<code>@SuppressWarnings("UnresolvedSpelSymbol")</code>。
</p>
</body>
