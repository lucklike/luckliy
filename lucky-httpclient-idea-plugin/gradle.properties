# 构建固定使用 JDK 21，避免继承本机 JAVA_HOME=Java 8
# macOS 下 JDK 根目录不带 Contents/Home 不是合法的 Java Home，Gradle 会直接报
# "Value ... given for org.gradle.java.home Gradle property is invalid"
org.gradle.java.home=/Users/fukang/Java-Env/jdk-21.0.12.1.jdk/Contents/Home
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# 完整版沙箱（runIdeFull）使用的本机 IDEA 安装目录；也可用 -PidePath=... 或环境变量 IDEA_HOME 覆盖
idePath=D:/Application/IDEA-2026.3/IntelliJ IDEA 2026.3
